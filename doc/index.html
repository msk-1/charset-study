<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>日本語の文字コード対応表</title>
<meta http-equiv="refresh" content="0; url=charset-mapping.html">
<link rel="canonical" href="charset-mapping.html">
<style>
  :root { --bg: #fbfbfa; --fg: #1f2328; --accent: #1c7ed6; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg: #16181c; --fg: #e6e8eb; --accent: #4dabf7; }
  }
  :root[data-theme="dark"] { --bg: #16181c; --fg: #e6e8eb; --accent: #4dabf7; }
  body { margin: 0; padding: 40px 16px; background: var(--bg); color: var(--fg);
    font-family: "Hiragino Sans", "Noto Sans JP", "Yu Gothic", sans-serif; }
  a { color: var(--accent); }
</style>
</head>
<body>
