# doc/ フォルダの中身を GitHub Pages に公開する。
# main に push されるたびに実行する。手動でも実行できる。
name: Pages

on:
  push:
    branches: [main]
    paths: ["doc/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: doc
      - id: deployment
        uses: actions/deploy-pages@v5
